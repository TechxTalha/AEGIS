spring:
  application:
    name: aegis-backend
    
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/aegis?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:aegis_user}
    password: ${SPRING_DATASOURCE_PASSWORD:aegis_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate # Flyway is the sole authority
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    show-sql: false # Enable for local debugging

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

jwt:
  secret: ${JWT_SECRET:default_super_secret_jwt_key_that_should_be_at_least_256_bits_long_for_hs256_algorithm_in_dev}
  expiration: ${JWT_EXPIRATION_MS:900000} # 15 minutes default
  refresh-expiration: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 days default
  cookie-name: aegis_refresh_token
