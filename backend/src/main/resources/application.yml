spring:
  application:
    name: aegis-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  main:
    allow-circular-references: true
    
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/aegis?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:aegis_user}
    password: ${SPRING_DATASOURCE_PASSWORD:aegis_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate # Flyway is the sole authority
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    show-sql: false # Enable for local debugging

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

jwt:
  secret: ${JWT_SECRET:default_super_secret_jwt_key_that_should_be_at_least_256_bits_long_for_hs256_algorithm_in_dev}
  expiration: ${JWT_EXPIRATION_MS:900000} # 15 minutes default
  refresh-expiration: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 days default
  cookie-name: aegis_refresh_token

aegis:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173}
  secret:
    key: ${AEGIS_SECRET_KEY:default-insecure-master-key-change-me}
  model:
    # Primary Model (e.g. OpenAI / Groq / Primary provider)
    primary:
      provider: ${AEGIS_MODEL_PRIMARY_PROVIDER:${AEGIS_MODEL_PROVIDER:openai}}
      endpoint: ${AEGIS_MODEL_PRIMARY_ENDPOINT:${AEGIS_MODEL_ENDPOINT:https://api.openai.com/v1}}
      api-key: ${AEGIS_MODEL_PRIMARY_API_KEY:${AEGIS_MODEL_API_KEY:}}
      model-name: ${AEGIS_MODEL_PRIMARY_NAME:${AEGIS_MODEL_NAME:gpt-4o}}
    # Fallback Tier 1 (e.g. Groq free tier)
    fallback1:
      provider: ${AEGIS_MODEL_FALLBACK1_PROVIDER:groq}
      endpoint: ${AEGIS_MODEL_FALLBACK1_ENDPOINT:https://api.groq.com/openai/v1}
      api-key: ${AEGIS_MODEL_FALLBACK1_API_KEY:}
      model-name: ${AEGIS_MODEL_FALLBACK1_NAME:llama-3.3-70b-versatile}
    # Fallback Tier 2 (e.g. Google Gemini 1.5/2.0 Flash free tier)
    fallback2:
      provider: ${AEGIS_MODEL_FALLBACK2_PROVIDER:gemini}
      endpoint: ${AEGIS_MODEL_FALLBACK2_ENDPOINT:https://generativelanguage.googleapis.com/v1beta/openai/}
      api-key: ${AEGIS_MODEL_FALLBACK2_API_KEY:}
      model-name: ${AEGIS_MODEL_FALLBACK2_NAME:gemini-1.5-flash}
    # Fallback Tier 3 (e.g. OpenRouter / Mistral free models)
    fallback3:
      provider: ${AEGIS_MODEL_FALLBACK3_PROVIDER:openrouter}
      endpoint: ${AEGIS_MODEL_FALLBACK3_ENDPOINT:https://openrouter.ai/api/v1}
      api-key: ${AEGIS_MODEL_FALLBACK3_API_KEY:}
      model-name: ${AEGIS_MODEL_FALLBACK3_NAME:meta-llama/llama-3.1-8b-instruct:free}


