# AEGIS Backend - Production Profile
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: AegisProdHikariCP
      maximum-pool-size: 15
      minimum-idle: 5
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate # Flyway is the sole schema authority
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
    show-sql: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  swagger-ui:
    enabled: false # Disabled in production for security
  api-docs:
    enabled: false

logging:
  level:
    root: WARN
    com.aegis: INFO
    org.springframework.web: WARN
    org.hibernate: ERROR

aegis:
  cors:
    # In production, Nginx typically acts as reverse-proxy on same host.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost,https://localhost,http://127.0.0.1,http://169.58.232.237,https://169.58.232.237}
