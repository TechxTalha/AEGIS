spring:
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate

server:
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  swagger-ui:
    enabled: false # Disable swagger UI in production
  api-docs:
    enabled: false

logging:
  level:
    root: WARN
    com.aegis: INFO
    org.springframework.web: WARN
    org.hibernate: ERROR
